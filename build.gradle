import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.9'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'org.spongepowered.gradle.plugin' version '2.5.0'
    //id("org.spongepowered.plugin") version "0.9.0"
}

base {
    archivesName = project.name.toLowerCase()
}

repositories {
    mavenLocal()
    mavenCentral()
    flatDir {
        dirs "lib"
    }
    // Any maven repo offline can cause the buildscript to fail during AT Extraction!
    maven {
        name = 'forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'oss-sonatype-public'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name 'drnaylor-minecraft'
        url 'https://repo.drnaylor.co.uk/artifactory/list/minecraft'
    }
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
    maven {
        name = 'bstats'
        url = 'https://repo.codemc.org/repository/maven-public'
    }
    maven {
        url = "https://raw.githubusercontent.com/FabioZumbi12/UltimateChat/mvn-repo"
    }
    maven {
        name = "LuckPerms"
        url = "https://repo.lucko.me/"
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'glare'
        url = 'https://repo.glaremasters.me/repository/bloodshot'
    }
    maven {
        name = 'ic2'
        url = 'https://maven.ic2.player.to/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

tasks.register('runServer') {
    overwrite = true
    // your new configuration here
}

dependencies {
    implementation cleanroom.userdev(cleanroom_version)
    implementation 'net.kyori:indigo:1.0.0-SNAPSHOT'
    implementation 'net.kyori:lunar:1.0.5-SNAPSHOT'
    implementation 'net.kyori:membrane:1.0.5'
    implementation 'net.kyori:violet:1.0.0'
    implementation 'net.kyori:text-api:3.0.4'
    implementation "net.kyori:text-serializer-legacy:3.0.4"
    implementation "net.kyori:event-api:3.0.0"
    implementation "net.kyori:event-api:5.0.0-SNAPSHOT"
    implementation "net.kyori:event-method:3.0.0"

    implementation 'io.github.nucleuspowered:nucleus-api:2.4.0'
    // Remember to update this entry for LuckPerms if the API gets behind the currently plugin version being used.
    implementation "net.luckperms:api:5.3"
    compileOnly deobf('com.almuradev:malisiscore:1.12.2-6.6.0-SNAPSHOT')
    // Attempt to use GD 2.0.3 API change.
    implementation 'com.griefdefender:api:2.1.0-SNAPSHOT'
    // IndustrialCraft 2 energy API for machines. Optional at runtime: only used when IC2 is installed, so it's neither shaded nor required.
    implementation 'net.industrial-craft:industrialcraft-2:2.8.220-ex112:api'
    implementation "net.kyori:adventure-api:4.9.3"
    // UltimateChat is a server plugin: compile against it, but don't load it in the dev client (its startup fails without a server).
    // Almura only uses it when the plugin is installed (see UchatUtil).
    implementation 'br.net.fabiozumbi12.UltimateChat:UltimateChat-Sponge-56-1.9.1'
    implementation 'org.spongepowered:configurate-gson:3.7.3'
    implementation 'com.almuradev:toolbox:1.0.0-SNAPSHOT'
    implementation "org.jooq:jooq:${project.jooqVersion}"
    implementation "org.jooq:jooq-meta:${project.jooqVersion}"
    implementation "org.jooq:jooq-codegen:${project.jooqVersion}"
    jooqCodegen("org.jooq:jooq-meta-extensions:${project.jooqVersion}")
}

ext.internalBuild = '123'
//version = "mc[${project.minecraftVersion}]-forge[${project.forgeBuild}]-sf[${project.spongeImplVersion.split("-")[2]}]-b${project.internalBuild}"

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Run Obfuscated Client"(Gradle) {
                    taskNames = ["runObfClient"]
                }
                "4. Run Obfuscated Server"(Gradle) {
                    taskNames = ["runObfServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                            (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}


processResources {
    // So a new build number or Minecraft version reprocesses mcmod.info (Gradle otherwise sees nothing changed)
    inputs.property 'internalBuild', project.internalBuild
    inputs.property 'minecraftVersion', project.minecraftVersion
    filesMatching('**/mcmod.info') {
        filter ReplaceTokens, tokens: [
                'build': project.internalBuild,
                'minecraftVersion': project.minecraftVersion
        ]
    }
}


cleanroom {
    runs {
        customClient{}
        customServer{}
    }
    loader {
        accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

jar {
//    classifier 'base'
    exclude 'log4j2-test.xml'

    manifest {
        attributes(
                'Built-By': System.properties['user.name'],
                'Created-By': System.properties['java.vm.version'] + ' (' + System.properties['java.vm.vendor'] + ')',
                'Implementation-Title': project.name,
                'Implementation-Version': version,
                'Implementation-Vendor': url,
                'FMLAT': "${project.name.toLowerCase()}_at.cfg",
                'FMLCorePlugin': 'com.almuradev.almura.AlmuraLoadingPlugin',
                'FMLCorePluginContainsFMLMod': true,
                'ForceLoadAsMod': true,
                'MixinConfigs': [
                        'mixins.almura.core.json',
                        "mixins.almura.accessors.json",
                        'mixins.almura.content.json',
                        'mixins.almura.content.block.json',
                        'mixins.almura.content.block.horizontal.json',
                        'mixins.almura.content.blocksoundgroup.json',
                        'mixins.almura.content.item.food.json',
                        'mixins.almura.content.item.json',
                        'mixins.almura.content.item.seed.json',
                        'mixins.almura.content.itemgroup.json',
                        'mixins.almura.content.mapcolor.json',
                        'mixins.almura.content.material.json',
                        'mixins.almura.feature.animal.json',
                        'mixins.almura.feature.cache.json',
                        'mixins.almura.feature.healthbar.json',
                        'mixins.almura.feature.almanac.json',
                        'mixins.almura.feature.sign.json',
                        'mixins.almura.feature.title.json',
                        'mixins.almura.feature.biome.json',
                        'mixins.almura.feature.nick.json'
                ].join(','),
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'TweakOrder': 0
        )
    }
}

shadowJar {
    //mainSpec.sourcePaths.clear()
    dependsOn reobfJar
//    classifier ''
    exclude 'dummyThing'
    relocate 'com.typesafe.config', 'configurate.typesafe.config'

    // Relocation of GD libraries here when using GD 2.0.3 (When libraries load in GameConstruct)
    relocate 'net.kyori.event', 'com.griefdefender.lib.kyori.event'
    relocate 'net.kyori.adventure', 'com.griefdefender.lib.kyori.adventure'
    dependencies {

        include dependency('com.almuradev:toolbox')
        include dependency('com.fasterxml.jackson.core:jackson-core')
        include dependency('com.google.inject.extensions:guice-assistedinject')
        include dependency('com.google.inject.extensions:guice-multibindings')
        include dependency('io.github.nucleuspowered:nucleus-api')
        include dependency('net.kyori:indigo')
        include dependency('net.kyori:text-serializer-legacy')
        include dependency('net.kyori:text-api')
        include dependency('net.kyori:lunar')
        include dependency('net.kyori:membrane')
        include dependency('net.kyori:violet')
        include dependency('ninja.leaping.configurate:configurate-json')
        include dependency('io.github.nucleuspowered:nucleus-api')
        include dependency('org.jooq:jooq')
        // Shade GD API because normally this doesn't load until PreInit an we need it during GameConstruct.
        include dependency('com.github.bloodmc:GriefDefenderAPI-2.0.0-Shaded')
        // The three following includes are shaded & relocated version of libraries used by GD 2.0 API
        // Found at /config/griefdefender/lib
        // You have to look at GDAPI's build.gradle file to figure out which version's he currently using
        // they don't alway match what he's put into the /config/griefdefender/lib folder....
        //include dependency("com.griefdefender.lib.kyori:examination-api-gd:1.1.0")
        //include dependency("com.griefdefender.lib.kyori:text-api-gd:3.0.4")
        //include dependency("com.griefdefender.lib.kyori:text-serializer-legacy-gd:3.0.4")
    }
    afterEvaluate {
        //from zipTree()
    }
}

artifacts {
    archives shadowJar
}

def generatedDir = 'src/main/generated'
sourceSets {
    main {
        java {
            srcDirs += [generatedDir]
        }
    }
}

tasks.register('generateDatabaseClasses') {}

tasks.register('cleanDatabaseClasses') {
    doLast {
        project.file(generatedDir).deleteDir()
    }
}

jooq {
    configuration {

    }
    executions {
        //version = project.jooqVersion
        //edition = project.jooqEdition
        axs {
            configuration {
                generator {
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        properties {
                            property {
                                key = 'scripts'
                                value = 'src/main/resources/db/axs/database.sql'
                            }
                        }

                        inputSchema = 'PUBLIC'
                        outputSchemaToDefault = true
                    }
                    generate {
                        relations = true
                        deprecated = false
                        records = true
                        immutablePojos = false
                        fluentSetters = true
                    }
                    target {
                        packageName = 'com.almuradev.generated.axs'
                        directory = generatedDir
                    }
                }

            }
        }
        store {
            configuration {
                generator {
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        properties {
                            property {
                                key = 'scripts'
                                value = 'src/main/resources/db/store/database.sql'
                            }
                        }

                        inputSchema = 'PUBLIC'
                        outputSchemaToDefault = true
                    }
                    generate {
                        relations = true
                        deprecated = false
                        records = true
                        immutablePojos = false
                        fluentSetters = true
                    }
                    target {
                        packageName = 'com.almuradev.generated.store'
                        directory = generatedDir
                    }
                }
            }
        }
        title {
            configuration {
                generator {
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        properties {
                            property {
                                key = 'scripts'
                                value = 'src/main/resources/db/title/database.sql'
                            }
                        }

                        inputSchema = 'PUBLIC'
                        outputSchemaToDefault = true
                    }
                    generate {
                        relations = true
                        deprecated = false
                        records = true
                        immutablePojos = false
                        fluentSetters = true
                    }
                    target {
                        packageName = 'com.almuradev.generated.title'
                        directory = generatedDir
                    }
                }
            }
        }
    }
}

// TODO: fundamental Foundation issue
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}